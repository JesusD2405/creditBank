{% extends "base.html" %}
{% block title %}Iniciar Sesión{% endblock title%}

{% block content %}
<div class="d-flex justify-content-center align-items-center h-100 bg-info bg-opacity-50">
  <div class="card">
    <div class="card-header text-center">
      <h3>Iniciar Sesión</h3>
    </div>
    <div class="card-body">
      <form method="post">
        {% csrf_token %}
        {% if message_error %}
          <div class="alert alert-danger text-center p-2" role="alert">
            <p>{{ message_error }}</p>
          </div>
        {% endif %}
        <div class="input-group form-group">
          <span class="input-group-text">
            <i class="far fa-user"></i>
          </span>
          <input
            name="username"
            type="text"
            class="form-control"
            placeholder="nombre de usuario"
            required
          />
        </div>
        <div class="input-group form-group mt-3 mb-3">
          <span class="input-group-text">
            <i class="fas fa-key"></i>
          </span>
          <input
            name="password"
            type="password"
            class="form-control"
            placeholder="contraseña"
            required
          />
        </div>
        <div class="form-group text-center">
          <input
            type="submit"
            value="Iniciar Sesión"
            class="btn btn-primary"
          />
        </div>
      </form>
    </div>
    <div class="card-footer">
      <div class="d-flex justify-content-center links">
        <a href="/admin" target="_blank">Sitio de Administración</a>
      </div>
    </div>
  </div>
</div>
{% endblock content %}
